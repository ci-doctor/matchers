name: Matcher misbehaves
description: A matcher missed a failure, or fired on a log it should not have
title: "<matcher>: "
labels: [bug]
body:
  - type: input
    id: matcher
    attributes:
      label: Matcher
      description: Its name as you reference it, e.g. official/pytest.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What went wrong
      options:
        - It missed the failure (no window, or the cause was cut)
        - It fired on a log it should not match
        - It kept far more of the log than needed
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: The log
      description: Redacted (tokens, hostnames, emails, internal URLs). This becomes a fixture.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ci-doctor version
      placeholder: ci-doctor --version

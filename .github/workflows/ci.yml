name: ci

# `all-green` is the one check a main ruleset should require.
on:
  pull_request:
    branches: [main, "feat/**"]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify + index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
      # ci-doctor at its latest release tag, looked up on every run.
      - run: echo "CI_DOCTOR=git+https://github.com/ci-doctor/ci-doctor@$(gh release view --repo ci-doctor/ci-doctor --json tagName -q .tagName)" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
      # The official bar: 3 positive and 2 negative fixtures per output, and an exemption list
      # that only shrinks. Every other check verify runs is correctness, not policy.
      - run: uvx --from "$CI_DOCTOR" ci-doctor matchers verify . --min-positive 3 --min-negative 2 --exempt verify-exempt.txt
      - run: uvx --from "$CI_DOCTOR" ci-doctor matchers index . --check

  # Rules that need the base branch, which `verify` cannot see.
  guards:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv run --no-project --with pyyaml --with pytest pytest -q -p no:cacheprovider .github/scripts
      - env:
          BASE_REF: ${{ github.base_ref }}   # via env, never interpolated into the script
        run: uv run --no-project --with pyyaml python .github/scripts/registry_guards.py "origin/$BASE_REF"

  # Fixtures are real job logs; a token pasted in with one must not ship.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 dir /repo/matchers --redact --no-banner

  actions:
    name: workflow audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uvx zizmor --config .github/zizmor.yml .github/workflows

  site:
    name: site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site

  all-green:
    if: always()
    needs: [verify, guards, secrets, actions, site]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' >/dev/null

name: conventions

# The PR title becomes the squash commit. Its own workflow: a retitle fires only
# `edited`, which must not re-run ci.yml. Same rules as ci-doctor's.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: conventions-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conventions:
    runs-on: ubuntu-latest
    env:
      TYPES: feat|fix|docs|test|chore|refactor|perf|ci|build|style|revert
      # Dependabot is exempt by who opened the PR: a fork can name its branch dependabot/*.
      AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - name: Branch name is <type>/<slug>
        env:
          BRANCH: ${{ github.head_ref }}   # via env, never interpolated into the script
        run: |
          [[ "$AUTHOR" == "dependabot[bot]" ]] && { echo "branch '$BRANCH' ok (dependabot)"; exit 0; }
          if [[ ! "$BRANCH" =~ ^($TYPES)/[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
            echo "::error::branch '$BRANCH' is not <type>/<slug>. Types: ${TYPES//|/, }"
            exit 1
          fi
          echo "branch '$BRANCH' ok"
      - name: PR title is a Conventional Commit
        if: ${{ env.AUTHOR != 'dependabot[bot]' }}
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$TITLE" =~ ^($TYPES)(\([a-z0-9._/-]+\))?!?:\ .+$ ]] || (( ${#TITLE} > 72 )); then
            echo "::error::title '$TITLE' is not <type>(<scope>): <subject>, at most 72 chars. Types: ${TYPES//|/, }"
            exit 1
          fi
          echo "title ok"

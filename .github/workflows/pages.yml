name: pages

# Publishes matchers.cidoc.dev: the catalogue (built from site/) plus the
# raw registry (index.yaml, its signature index.yaml.sig, matchers/, bundles/) that
# `ci-doctor` fetches from the same domain. The site creates no page at those three paths. The custom domain is set in the
# repo's Pages settings; an Actions deploy ignores a CNAME file.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"   # re-sign weekly: a signature is accepted for 30 days
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false   # never cut a deploy off half-way

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # ci.yml's checks again, so a push that breaks them never deploys. Here rather than
      # a workflow_run of ci: that trigger runs main's copy of this file in a privileged
      # context, and the checks are cheap. test_workflows.py keeps the commands in step.
      - uses: astral-sh/setup-uv@v10.3.3
      # ci-doctor at its latest release tag, looked up on every run.
      - run: echo "CI_DOCTOR=git+https://github.com/ci-doctor/ci-doctor@$(gh release view --repo ci-doctor/ci-doctor --json tagName -q .tagName)" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: uvx --from "$CI_DOCTOR" ci-doctor matchers verify . --min-positive 3 --min-negative 2 --exempt verify-exempt.txt
      - run: uvx --from "$CI_DOCTOR" ci-doctor matchers index . --check
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      # Only the registry joins the site: index, matchers (fixtures included) and
      # bundles. Repo plumbing stays out of the published tree.
      - run: cp -r index.yaml matchers bundles site/dist/
      # Sign the index being deployed, so ci-doctor can tell it is the official one.
      # The key id must be one ci-doctor ships (ci_doctor/matchers/signing.py).
      - run: uv run --no-project --with pynacl python .github/scripts/sign_index.py site/dist
        env:
          INDEX_SIGNING_KEY: ${{ secrets.INDEX_SIGNING_KEY }}
          INDEX_SIGNING_KEY_ID: official-1
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

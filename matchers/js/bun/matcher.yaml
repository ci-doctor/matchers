schema: 1
id: bun
description: Bun, the JavaScript runtime and toolkit - failing tests, install refusals, and scripts that exited non-zero.
tags: [js, test, deps]
outputs:
  test:
    description: >-
      A failed `bun test` - the failing test's name, then the assertion under it with expected
      against received.
    window: {after: 7}
    variants:
      symbol:
        match: {regex: '^\s*✗ '}
      text:
        match: {regex: '^\(fail\) '}
  install:
    description: >-
      bun install refusing a dependency - no version matching its range, or a package the
      registry does not have. A typo, an unpublished version, or a private registry.
    match: {regex: 'error: (No version matching|GET .+ - 404)'}
    window: {before: 1, after: 2}
  run:
    role: wrapper
    description: >-
      bun reporting that a package.json script exited non-zero (`error: script "x" exited with
      code N`). A wrapper - the script's output above it is the cause.
    match: {regex: 'error: script ".+" exited with code \d+'}

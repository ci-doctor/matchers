schema: 1
id: command_not_found
role: issue
description: >-
  The shell reporting a command it cannot find (exit code 127) - a tool missing from the image
  or not on PATH, or a script whose shebang names a missing interpreter.
tags: [any, infra]
match: {regex: ': line \d+: \S+: command not found$|^\S*sh: \d+: \S+: not found$|^zsh: command not found: |^/usr/bin/env: .+: No such file or directory$'}
window: {before: 2, after: 1}

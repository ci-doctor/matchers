schema: 1
id: bazel
role: wrapper
description: Bazel reporting that an action or target failed. A wrapper - the compiler or test output it relays is the cause.
tags: [any, build]
match: {regex: '^ERROR: \S+:\d+:\d+: .*(failed|FAILED)|^FAILED: Build did NOT complete|^//\S+\s+FAILED in \d'}
window: {before: 2, after: 10}

schema: 1
id: git
description: >-
  git's fatal: - credentials refused, a missing repository, ref or submodule, or a shallow-clone
  limit. The message after fatal: names the cause.
tags: [any, infra]
match:
  all:
    - regex: '^(Error: )?fatal: '
    - not: {regex: '^fatal: \['}
window: {before: 2, after: 3}

schema: 1
id: registry_error
role: issue
description: >-
  A container registry refusing a pull or push - denied, unauthorized, toomanyrequests (the pull
  rate limit), manifest unknown. Credentials, permissions or a missing tag, not the build.
tags: [container, infra]
match: {regex: '\btoomanyrequests\b|\bmanifest unknown\b|\bname unknown\b|^denied: |\bdenied: requested access|\bunauthorized: (authentication required|incorrect username or password)|/v2/\S+: (401 Unauthorized|403 Forbidden|429 Too Many Requests)'}
window: {before: 2, after: 1}

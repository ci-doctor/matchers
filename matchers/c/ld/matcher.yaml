schema: 1
id: ld
description: >-
  GNU ld failing to link - an undefined reference (a library or object left out, or a symbol
  declared but never defined) or a library it cannot find (`cannot find -lssl`).
tags: [c, build]
match: {regex: 'undefined reference to|/ld: cannot find -l|collect2: error: ld returned'}
window: {before: 2, after: 1}

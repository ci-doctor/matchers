schema: 1
id: pytest
description: pytest - failing tests, modules that could not be collected, crashed xdist workers, and a coverage bar the run did not reach.
tags: [python, test]
outputs:
  failures:
    description: >-
      pytest's `=== FAILURES ===` block, from the first failing test through to the short
      summary. The assertion and traceback name the cause.
    match: {regex: '^=+ FAILURES =+'}
    window:
      until: {regex: '^=+ short test summary'}
      max_lines: 500
  errors:
    description: >-
      pytest's `=== ERRORS ===` block - a test module that failed to import, or a fixture that
      raised. Those tests never ran; the error is in setup, not in an assertion.
    match: {regex: '^=+ ERRORS =+'}
    window:
      until: {regex: '^=+ short test summary'}
      max_lines: 500
  coverage:
    role: gate
    description: >-
      pytest-cov failing the run on coverage - Required test coverage of N% not reached - with
      every test passing. No test failed; coverage fell below the bar.
    match: {regex: '^FAIL Required test coverage of \d+(\.\d+)?% not reached'}
    window: {before: 3}
  workers:
    description: >-
      A pytest-xdist worker that died - node down, worker crashed while running a test. Usually
      a crash or OOM in that test, not a failed assertion; it leaves no FAILURES entry of its own.
    match: {regex: '\[gw\d+\] node down: |worker .gw\d+. crashed while running '}
    window: {before: 1, after: 2}

schema: 1
id: phpunit
role: tool
description: PHPUnit's `There were N failures` block through to its `FAILURES`/`ERRORS`/`OK` footer.
tags: [php, test]
match: {regex: ^There (was|were) \d+ (failure|error)}
window:
  until: {regex: ^(FAILURES|ERRORS|OK)}
  max_lines: 500
  condense: {regex: '^(\d+\) |Failed asserting|/\S+\.php:\d+$|There (was|were) |FAILURES!|ERRORS!|Tests: )|[\w\\]*(Error|Exception):'}

# The contributor's bench for the official matcher registry.

[tools]
uv = "latest"   # runs ci-doctor (uvx) and the guard scripts
node = "lts"    # builds and serves the site
gh = "latest"   # looks up the ci-doctor release to run

[env]
# The ci-doctor that provides `matchers verify` / `index`: its latest release tag, as in CI.
CI_DOCTOR = "git+https://github.com/ci-doctor/ci-doctor@{{ exec(command='gh release view --repo ci-doctor/ci-doctor --json tagName -q .tagName') }}"

[tasks.verify]
description = "Golden fixtures, fixture counts and every validation rule"
run = 'uvx --from "$CI_DOCTOR" ci-doctor matchers verify . --min-positive 3 --min-negative 2 --exempt verify-exempt.txt'

[tasks.update]
description = "Regenerate every .expected file — then read the diff before committing"
run = 'uvx --from "$CI_DOCTOR" ci-doctor matchers verify --update .'

[tasks.index]
description = "Regenerate index.yaml and the ecosystem bundles"
run = 'uvx --from "$CI_DOCTOR" ci-doctor matchers index .'

[tasks.guards]
description = "The base-branch guards: names and output ids are permanent, verify-exempt.txt only shrinks"
run = "uv run --no-project --with pyyaml python .github/scripts/registry_guards.py origin/main"

[tasks.check]
description = "Everything CI runs"
run = 'uvx --from "$CI_DOCTOR" ci-doctor matchers index . --check'
depends = ["verify", "guards"]

[tasks.docs]
description = "Serve the registry site locally with live reload (http://localhost:4321)"
dir = "site"
run = "npm ci && npm run dev"
